spring.application.name=erp
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/erp-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
app.auth.jwt-secret=${JWT_SECRET:dev-only-change-this-secret-dev-only-change-this-secret}
app.auth.access-token-minutes=30
app.auth.refresh-token-days=30
app.auth.email-verification-minutes=15
app.auth.forgot-password-minutes=15
app.auth.refresh-cookie-name=refresh_token
app.auth.refresh-cookie-secure=false
app.auth.frontend-url=http://localhost:8080
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
