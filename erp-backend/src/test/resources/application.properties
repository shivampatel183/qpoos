spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

app.auth.jwt-secret=dev-only-change-this-secret-dev-only-change-this-secret
app.auth.access-token-minutes=15
app.auth.refresh-token-days=30
app.auth.email-verification-minutes=1440
app.auth.forgot-password-minutes=15
app.auth.refresh-cookie-name=refresh_token
app.auth.refresh-cookie-secure=false
app.auth.frontend-url=http://localhost:8080
